[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelrat"
version = "1.0.0"
description = "Authorized endpoint monitoring demonstration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "httpx>=0.27,<1.0",
    "streamlit>=1.38,<2.0",
    "python-dotenv>=1.0,<2.0",
    "psutil>=6.0,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]